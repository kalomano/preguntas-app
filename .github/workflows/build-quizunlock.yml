name: Build Quiz Unlock APK

on:
  workflow_dispatch:
  push:
    paths:
      - "quizunlock/**"
      - ".github/workflows/build-quizunlock.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: quizunlock
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.1"

      - name: Build APK
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: QuizUnlock-debug
          path: quizunlock/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
